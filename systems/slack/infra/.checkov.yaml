# Checkov configuration for infra/ (REQ-INFRA-016).
# Checkov OSS does not report severities without a platform API key, so CI fails
# on every finding (stricter than "High or above"). Repository-wide skips below
# are reviewed through CODEOWNERS (Ops + Dev tech lead) like any policy change.
# Inline suppressions must use `#checkov:skip=<ID>:<reason> approved-by:@<ops>,@<dev-lead>`
# (enforced by tools/src/check-suppressions.ts).
framework:
  - terraform
compact: true
quiet: true
download-external-modules: false
skip-check:
  # S3 access logs: object-level access to state/log buckets is recorded by the
  # organization CloudTrail; server access logs would need yet another bucket.
  - CKV_AWS_18
  # Cross-region replication: state buckets are per account/region by design
  # (Osaka has its own bucket, ADR-0020); log buckets are protected by Object Lock.
  - CKV_AWS_144
  # S3 event notifications: no consumer for bucket events in this change.
  - CKV2_AWS_62
