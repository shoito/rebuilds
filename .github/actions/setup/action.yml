name: Setup pnpm project
description: Install Node.js and pnpm, restore the pnpm store and install one pnpm project with its frozen lockfile
inputs:
  project:
    description: Directory of the pnpm project, e.g. tools/spec-checks or systems/slack
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.project }}/package.json
        cache: true
        cache_dependency_path: ${{ inputs.project }}/pnpm-lock.yaml
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project }}
      run: pnpm install --frozen-lockfile
