# REQ-DLV-015 (ADR-0004): label PRs that were merged without an approval
# (admin bypass) with `review:post-merge` for the after-the-fact review.
name: Post-merge review

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/spec-checks
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Label if merged without approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node tools/spec-checks/src/cli.ts post-merge "$PR"
